name: Database Backup

on:
  schedule:
    - cron: "5 11 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.BACKUP_S3_REGION || 'us-east-1' }}

      - name: Create PostgreSQL dump
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          set -euo pipefail
          STAMP="$(date -u +'%Y-%m-%dT%H-%M-%SZ')"
          DUMP_FILE="/tmp/backup-${STAMP}.dump"

          echo "BACKUP_STAMP=${STAMP}" >> "$GITHUB_ENV"
          echo "BACKUP_DUMP_FILE=${DUMP_FILE}" >> "$GITHUB_ENV"

          pg_dump \
            --format=custom \
            --compress=9 \
            --no-owner \
            --no-privileges \
            --file "$DUMP_FILE" \
            "$BACKUP_DATABASE_URL"

      - name: Package backup artifacts
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          npx tsx scripts/db/package-postgres-backup.ts \
            --input "$BACKUP_DUMP_FILE" \
            --output-dir /tmp/backup-artifacts \
            --stamp "$BACKUP_STAMP"

      - name: Upload backup artifacts to S3
        env:
          BACKUP_S3_BUCKET: ${{ vars.BACKUP_S3_BUCKET }}
          BACKUP_S3_ENDPOINT: ${{ vars.BACKUP_S3_ENDPOINT }}
          BACKUP_S3_PREFIX: ${{ vars.BACKUP_S3_PREFIX }}
        run: |
          set -euo pipefail
          DATE_PREFIX="$(date -u +'%Y/%m/%d')"
          KEY_PREFIX="${BACKUP_S3_PREFIX:+${BACKUP_S3_PREFIX}/}${DATE_PREFIX}/"
          DESTINATION="s3://${BACKUP_S3_BUCKET}/${KEY_PREFIX}"

          if [ -n "${BACKUP_S3_ENDPOINT}" ]; then
            aws s3 cp /tmp/backup-artifacts "$DESTINATION" --recursive --endpoint-url "$BACKUP_S3_ENDPOINT"
          else
            aws s3 cp /tmp/backup-artifacts "$DESTINATION" --recursive
          fi

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: postgres-backup-${{ env.BACKUP_STAMP }}
          path: /tmp/backup-artifacts
          if-no-files-found: error
          retention-days: 7
