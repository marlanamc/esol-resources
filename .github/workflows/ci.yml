name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test
  POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/test
  NEXTAUTH_SECRET: test-secret-at-least-32-chars-long-for-ci
  AUTH_SECRET: test-secret-at-least-32-chars-long-for-ci
  NEXTAUTH_URL: http://localhost:3000

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Generated content check
        run: npm run check:generated

      - name: Mini guides audit (W1–W18)
        run: npm run audit:mini-guides

      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=critical

      - name: Prepare database schema
        run: npm run ci:db:prepare

      - name: Node test suites
        run: npm run test:node

      - name: Vitest coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

  e2e:
    # Playwright 1.58 cannot install browsers on ubuntu-latest (26.04) yet.
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test
      POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/test
      DEV_SEED_ACCOUNT_PASSWORD: ci-seed-password-1234
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Browsers are cached per Playwright version. The system packages they
      # need (WebKit's media libraries are the bulk) come from apt, whose mirror
      # can crawl, so the downloaded .deb files are cached too and copied back
      # into apt's archive before installing. The timeouts turn a stall into a
      # quick failure instead of a job that hangs.
      - name: Read Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-chromium-webkit

      - name: Cache Playwright apt packages
        id: apt-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/apt-playwright
          key: apt-playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-chromium-webkit

      - name: Reuse cached apt packages
        run: |
          echo 'APT::Keep-Downloaded-Packages "true";' | sudo tee /etc/apt/apt.conf.d/99-keep-downloaded-packages
          if compgen -G "$HOME/.cache/apt-playwright/*.deb" > /dev/null; then
            sudo cp "$HOME"/.cache/apt-playwright/*.deb /var/cache/apt/archives/
          fi

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium webkit

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        timeout-minutes: 10
        run: npx playwright install-deps chromium webkit

      - name: Keep apt packages for the cache
        if: steps.apt-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.cache/apt-playwright"
          if compgen -G "/var/cache/apt/archives/*.deb" > /dev/null; then
            cp /var/cache/apt/archives/*.deb "$HOME/.cache/apt-playwright/"
          fi

      - name: Prepare database schema
        run: npm run ci:db:prepare

      - name: Seed grammar guides
        run: npm run db:seed:guides

      - name: Seed base application data
        run: npm run db:seed:base

      - name: Seed E2E accounts
        run: npx tsx scripts/e2e-seed.ts

      - name: Build application for E2E
        run: npm run build

      - name: Run E2E tests
        run: npm run test:e2e:smoke
