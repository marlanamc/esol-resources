name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

env:
  POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/test
  NEXTAUTH_SECRET: test-secret-at-least-32-chars-long-for-ci
  AUTH_SECRET: test-secret-at-least-32-chars-long-for-ci
  NEXTAUTH_URL: http://localhost:3000

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Prepare database schema
        run: npm run ci:db:prepare

      - name: Critical tests - gamification helpers
        run: npm run test:gamification

      - name: Critical tests - activity submit assignmentId
        run: npm run test:activity-submit

      - name: Critical tests - exercise answer normalization
        run: npm run test:exercise-answer-normalization

      - name: Critical tests - activity submit contract
        run: npm run test:activity-submit:contract

      - name: Critical tests - activity progress merge
        run: npm run test:activity-progress:merge

      - name: Critical tests - activity progress points
        run: npm run test:activity-progress:points

      - name: Critical tests - assignments featured
        run: npm run test:assignments-featured

      - name: Critical tests - classes join
        run: npm run test:classes-join

      - name: Critical tests - submission points claim
        run: npm run test:submission-points-claim

      - name: Critical tests - sanitize
        run: npm run test:sanitize

      - name: Critical tests - validators env
        run: npm run test:validators-env

      - name: Vitest coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    env:
      DEV_SEED_ACCOUNT_PASSWORD: ci-seed-password-1234
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Prepare database schema
        run: npm run ci:db:prepare

      - name: Seed grammar guides
        run: npm run db:seed:guides

      - name: Seed base application data
        run: npm run db:seed:base

      - name: Seed E2E accounts
        run: npx tsx scripts/e2e-seed.ts

      - name: Run E2E tests
        run: npm run test:e2e:smoke
